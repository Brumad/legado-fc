name: Validar Legado FC

on:
  pull_request:
    branches: ["main"]
  push:
    branches:
      - "feat/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Preparar o Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Validar Match Core 0.5
        run: pnpm verify:match-core

      - name: Validar integração carreira e Match Core
        run: pnpm verify:match-integration

      - name: Validar interface de carreira 0.5.1
        run: pnpm verify:career-ui

      - name: Validar partida 2D jogável 0.5.2
        run: pnpm verify:playable-match

      - name: Validar gameplay e UX 0.5.3
        run: pnpm verify:0.5.3

      - name: Validar apresentação visual 0.5.4
        run: pnpm verify:0.5.4

      - name: Validar bolas paradas 3D 0.5.5
        run: pnpm verify:set-pieces-3d

      - name: Testar 5.000 partidas legadas
        run: pnpm verify:variation

      - name: Testar 25 temporadas do mundo
        run: pnpm verify:world

      - name: Build de produção
        run: pnpm build

      - name: Testes de renderização
        run: pnpm test:render

      - name: Build GitHub Pages
        run: pnpm build:github
        env:
          GITHUB_PAGES_BASE: /legado-fc/

      - name: Preparar navegador para validações visuais
        if: (startsWith(github.ref_name, 'feat/v0.5.1') || startsWith(github.head_ref, 'feat/v0.5.1') || startsWith(github.ref_name, 'feat/v0.5.2') || startsWith(github.head_ref, 'feat/v0.5.2') || startsWith(github.ref_name, 'feat/v0.5.3') || startsWith(github.head_ref, 'feat/v0.5.3') || startsWith(github.ref_name, 'feat/v0.5.4') || startsWith(github.head_ref, 'feat/v0.5.4') || startsWith(github.ref_name, 'feat/v0.5.5') || startsWith(github.head_ref, 'feat/v0.5.5'))
        run: |
          pnpm add --save-dev @playwright/test@1.56.0 --lockfile=false
          pnpm exec playwright install --with-deps chromium

      - name: Validar interface de carreira em 360px tablet e desktop
        if: (startsWith(github.ref_name, 'feat/v0.5.1') || startsWith(github.head_ref, 'feat/v0.5.1') || startsWith(github.ref_name, 'feat/v0.5.2') || startsWith(github.head_ref, 'feat/v0.5.2') || startsWith(github.ref_name, 'feat/v0.5.3') || startsWith(github.head_ref, 'feat/v0.5.3') || startsWith(github.ref_name, 'feat/v0.5.4') || startsWith(github.head_ref, 'feat/v0.5.4') || startsWith(github.ref_name, 'feat/v0.5.5') || startsWith(github.head_ref, 'feat/v0.5.5'))
        run: |
          pnpm exec vite preview --config vite.github.config.ts --host 127.0.0.1 --port 4173 > /tmp/legado-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/legado-fc/ > /dev/null; then break; fi
            sleep 1
          done
          pnpm exec playwright test tests/career-ui.visual.spec.mjs --reporter=line --workers=1
        env:
          GITHUB_PAGES_BASE: /legado-fc/

      - name: Validar partida jogável real 0.5.2+
        if: startsWith(github.ref_name, 'feat/v0.5.2') || startsWith(github.head_ref, 'feat/v0.5.2') || startsWith(github.ref_name, 'feat/v0.5.3') || startsWith(github.head_ref, 'feat/v0.5.3') || startsWith(github.ref_name, 'feat/v0.5.4') || startsWith(github.head_ref, 'feat/v0.5.4') || startsWith(github.ref_name, 'feat/v0.5.5') || startsWith(github.head_ref, 'feat/v0.5.5')
        run: |
          pnpm exec playwright test tests/playable-match.visual.spec.mjs --reporter=line --workers=1
        env:
          GITHUB_PAGES_BASE: /legado-fc/

      - name: Validar creator controles e ajustes 0.5.3+
        if: startsWith(github.ref_name, 'feat/v0.5.3') || startsWith(github.head_ref, 'feat/v0.5.3') || startsWith(github.ref_name, 'feat/v0.5.4') || startsWith(github.head_ref, 'feat/v0.5.4') || startsWith(github.ref_name, 'feat/v0.5.5') || startsWith(github.head_ref, 'feat/v0.5.5')
        run: |
          pnpm exec playwright test tests/v053.visual.spec.mjs --reporter=line --workers=1
        env:
          GITHUB_PAGES_BASE: /legado-fc/

      - name: Validar apresentação real 0.5.4+
        if: startsWith(github.ref_name, 'feat/v0.5.4') || startsWith(github.head_ref, 'feat/v0.5.4') || startsWith(github.ref_name, 'feat/v0.5.5') || startsWith(github.head_ref, 'feat/v0.5.5')
        run: |
          pnpm exec playwright test tests/v054.visual.spec.mjs --reporter=line --workers=1
        env:
          GITHUB_PAGES_BASE: /legado-fc/

      - name: Validar bolas paradas 3D reais 0.5.5
        if: startsWith(github.ref_name, 'feat/v0.5.5') || startsWith(github.head_ref, 'feat/v0.5.5')
        run: |
          pnpm exec playwright test tests/v055.set-pieces.visual.spec.mjs --reporter=line --workers=1
        env:
          GITHUB_PAGES_BASE: /legado-fc/
